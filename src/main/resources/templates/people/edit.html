<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Edit a reader')}"></head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main>
    <h1>Edit a reader</h1>
    <form th:action="@{/people/{id}(id=${person.id})}" th:method="patch" th:object="${person}" class="panel">
        <div th:replace="~{people/form :: fields}"></div>
        <div class="actions"><button type="submit">Save changes</button><a th:href="@{/people/{id}(id=${person.id})}">Cancel</a></div>
    </form>
</main>
</body>
</html>
