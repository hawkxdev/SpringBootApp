<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add a reader')}"></head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main>
    <h1>Add a reader</h1>
    <form th:action="@{/people}" th:method="post" th:object="${person}" class="panel">
        <div th:replace="~{people/form :: fields}"></div>
        <div class="actions"><button type="submit">Add reader</button><a th:href="@{/people}">Cancel</a></div>
    </form>
</main>
</body>
</html>
