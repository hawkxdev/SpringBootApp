<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Readers')}"></head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main>
    <div class="heading"><h1>Readers</h1><a class="button" th:href="@{/people/new}">Add a reader</a></div>
    <p class="panel" th:if="${people.isEmpty()}">No readers yet.</p>
    <ul class="cards">
        <li class="panel" th:each="reader : ${people}">
            <a class="item-title" th:href="@{/people/{id}(id=${reader.id})}" th:text="${reader.name}"></a>
            <p th:text="|Born ${reader.yearOfBirth}|"></p>
        </li>
    </ul>
</main>
</body>
</html>
