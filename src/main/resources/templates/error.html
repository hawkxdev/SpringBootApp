<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library request error</title>
    <style>body{font:1rem/1.6 system-ui,sans-serif;max-width:40rem;margin:12vh auto;padding:1.5rem;color:#173b36}h1{line-height:1.2}a{color:#056c55}</style>
</head>
<body>
<main>
    <h1 th:text="${status} + ' · ' + ${error}">Request could not be completed</h1>
    <p th:if="${guidance != null}" th:text="${guidance}"></p>
    <p>The requested operation was not completed. Check the details and try again.</p>
    <a href="/books">Back to the library</a>
</main>
</body>
</html>
