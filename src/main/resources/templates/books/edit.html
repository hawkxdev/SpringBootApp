<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Edit a book')}"></head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main>
    <h1>Edit a book</h1>
    <form th:action="@{/books/{id}(id=${book.id})}" th:method="patch" th:object="${book}" class="panel">
        <div th:replace="~{books/form :: fields}"></div>
        <div class="actions"><button type="submit">Save changes</button><a th:href="@{/books/{id}(id=${book.id})}">Cancel</a></div>
    </form>
</main>
</body>
</html>
