<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Search books')}"></head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main>
    <h1>Search books</h1>
    <form th:action="@{/books/search}" method="get" class="toolbar">
        <label for="query">Title contains</label>
        <input id="query" type="search" name="q" maxlength="255" th:value="${searchQuery}">
        <button type="submit">Search</button>
    </form>
    <p class="hint" th:text="|Case insensitive search, up to ${maxResults} results.|"></p>
    <p th:if="${!#strings.isEmpty(searchQuery) and books.isEmpty()}" class="panel">No matching books.</p>
    <ul class="cards">
        <li class="panel" th:each="book : ${books}">
            <a class="item-title" th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}"></a>
            <p th:text="${book.author} + ' · ' + ${book.year}"></p>
            <p th:if="${book.person != null}">Borrower: <a th:href="@{/people/{id}(id=${book.person.id})}" th:text="${book.person.name}"></a></p>
            <span th:if="${book.person == null}" class="badge">Available</span>
            <span th:if="${book.overdue}" class="badge overdue">Overdue</span>
        </li>
    </ul>
</main>
</body>
</html>
