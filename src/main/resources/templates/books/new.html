<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add a book')}"></head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main>
    <h1>Add a book</h1>
    <form th:action="@{/books}" th:method="post" th:object="${book}" class="panel">
        <div th:replace="~{books/form :: fields}"></div>
        <div class="actions"><button type="submit">Add book</button><a th:href="@{/books}">Cancel</a></div>
    </form>
</main>
</body>
</html>
